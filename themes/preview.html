<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디자인 프리셋 카탈로그 — 부동산 인사이트</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0D1829;color:#F2F6FA;font-family:'Noto Sans KR',sans-serif;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:56px 24px 80px}
h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:2rem;margin-bottom:6px}
.sub{color:#96A5BA;margin-bottom:8px}
.hint{color:#5EE6D0;font-size:.9rem;margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{border:1px solid #2C3E5A;border-radius:16px;overflow:hidden;background:#132239}
.mock{padding:20px 20px 16px}
.mock .eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.12em;margin-bottom:6px}
.mock .title{font-weight:900;font-size:1.35rem;line-height:1.2;margin-bottom:10px}
.mock .barrail{height:14px;border-radius:7px;margin-bottom:6px;overflow:hidden}
.mock .barrail>div{height:100%;border-radius:7px}
.meta{padding:16px 20px 20px;border-top:1px solid #2C3E5A}
.meta .name{font-weight:700;font-size:1.05rem}
.meta .live{display:inline-block;font-size:.7rem;font-weight:700;color:#0D1829;background:#5EE6D0;
  border-radius:999px;padding:1px 10px;margin-left:6px;vertical-align:2px}
.meta .call{color:#7C8CF8;font-size:.82rem;margin-top:2px}
.meta .mood{color:#96A5BA;font-size:.85rem;margin-top:8px}
.sw{display:flex;gap:6px;margin-top:12px}
.sw span{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
footer{color:#96A5BA;font-size:.8rem;margin-top:48px}
a{color:#5EE6D0}
</style>
</head>
<body>
<div class="wrap">
  <h1>디자인 프리셋 카탈로그</h1>
  <p class="sub">보관 중인 테마 프리셋 모음 — 스타일 요소(색·타이포·무드)만 저장합니다.</p>
  <p class="hint">마음에 드는 카드의 <b>이름을 그대로 말하면</b> 사이트 테마 + 카드뉴스 세트로 적용해 드립니다. 예: "스너그 심플 테마로 추가해줘"</p>
  <div class="grid" id="grid"></div>
  <footer>
    데이터: <a href="design-library.json">design-library.json</a> ·
    <a href="../index.html">← 홈으로</a>
  </footer>
</div>
<script>
function firstColor(v){
  if(typeof v!=='string') return null;
  var m=v.match(/#[0-9a-fA-F]{3,8}|rgba?\([^)]*\)/);
  return m?m[0]:null;
}
fetch('design-library.json').then(function(r){return r.json()}).then(function(lib){
  var grid=document.getElementById('grid');
  Object.keys(lib.presets).forEach(function(key){
    var p=lib.presets[key], v=p.vars;
    var bg=firstColor(v.bg)||'#111', panel=firstColor(v.panel)||bg,
        ink=firstColor(v.ink)||'#fff', mute=firstColor(v.mute)||'#999',
        ac=firstColor(v.accent)||'#0af', ac2=firstColor(v.accent2)||ac,
        rail=firstColor(v.rail)||panel, fg=firstColor(v.fillgray)||mute;
    var serif=(p.typography&&/Serif/i.test(p.typography.heading||''));
    var isLive=(lib.active||[]).indexOf(key)>=0;
    var card=document.createElement('div'); card.className='card';
    card.innerHTML=
      '<div class="mock" style="background:'+bg+'">'+
        '<div class="eyebrow" style="color:'+ac+'">KEYWORD REPORT</div>'+
        '<div class="title" style="color:'+ink+';font-family:'+(serif?"'Noto Serif KR',serif":"'Noto Sans KR',sans-serif")+'">반세권</div>'+
        '<div style="background:'+panel+';border-radius:10px;padding:10px 12px">'+
          '<div class="barrail" style="background:'+rail+'"><div style="width:88%;background:linear-gradient(92deg,'+ac+','+ac2+')"></div></div>'+
          '<div class="barrail" style="background:'+rail+'"><div style="width:34%;background:'+fg+'"></div></div>'+
          '<div style="color:'+mute+';font-size:.72rem;margin-top:4px">9.76 : 1 vs 2.17 : 1</div>'+
        '</div>'+
      '</div>'+
      '<div class="meta">'+
        '<span class="name">'+p.label+'</span>'+(isLive?'<span class="live">LIVE</span>':'')+
        '<div class="call">호출명: "'+p.label+'" 또는 '+key+'</div>'+
        '<div class="mood">'+(p.mood||'')+'</div>'+
        '<div class="sw">'+[bg,panel,ink,ac,ac2].map(function(c){return '<span style="background:'+c+'"></span>'}).join('')+'</div>'+
      '</div>';
    grid.appendChild(card);
  });
});
</script>
</body>
</html>
