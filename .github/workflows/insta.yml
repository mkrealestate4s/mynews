name: Publish Instagram carousel

# 임장로그 캐러셀 자동 발행 — **현재 잠들어 있다(2026-08-26).**
#
# 인스타 웹 로그인이 계정 보안 차단에 걸려 토큰을 발급받지 못했다(비밀번호를
# 바꿔도, 시크릿 창에서도 같은 증상). 그래서 캐러셀은 폰 앱 예약 발행으로
# 운영한다 — CLAUDE.md '인스타 캐러셀 예약 발행' 절 참조.
#
# 되살리는 방법: ① 토큰 발급 ② 시크릿 IG_USER_ID·IG_ACCESS_TOKEN 등록
#   ③ 아래 schedule 주석 해제. 그날 아침부터 자동 발행된다.
# 스케줄을 껐으므로 매일 빈 실행이 쌓이지 않는다. 수동 점검은 언제든
# workflow_dispatch(기본 드라이런)로 가능하다.

on:
  # schedule:
  #   - cron: "10 23 * * *"      # 23:10 UTC = 08:10 KST (카드 배포 뒤)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "점검만 (발행하지 않음)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: insta
  cancel-in-progress: false      # 발행 중 취소되면 중복 발행 위험이 있다

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: gate
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "인스타 시크릿이 없습니다 — 발행을 건너뜁니다." >> $GITHUB_STEP_SUMMARY
            echo "ready=no" >> $GITHUB_OUTPUT
          else
            echo "ready=yes" >> $GITHUB_OUTPUT
          fi

      # 계정 유형·토큰·남은 할당량을 먼저 확인한다. 개인 계정이거나 토큰이
      # 만료됐으면 여기서 멈추므로 원인을 바로 알 수 있다.
      - name: Check account
        if: steps.gate.outputs.ready == 'yes'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_BASE: ${{ vars.IG_API_BASE }}
        run: |
          python3 tools/insta_publish.py --check | tee /tmp/chk.txt
          { echo '```'; cat /tmp/chk.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY

      - name: Publish
        if: steps.gate.outputs.ready == 'yes'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_BASE: ${{ vars.IG_API_BASE }}
        run: |
          FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"; fi
          python3 tools/insta_publish.py $FLAG | tee /tmp/out.txt
          { echo '```'; cat /tmp/out.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY

      - name: Record the published post
        if: steps.gate.outputs.ready == 'yes' && inputs.dry_run != true
        run: |
          if git diff --quiet -- publish/insta-posted.json; then
            echo "발행 기록 변화 없음 (건너뜀 또는 중복)"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish/insta-posted.json
          git commit -m "Record Instagram carousel publish"
          git push
