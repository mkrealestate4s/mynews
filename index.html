<style>
:root{--navy:#0D1829;--panel:#132239;--ink:#F2F6FA;--mute:#96A5BA;
  --teal:#5EE6D0;--peri:#7C8CF8;--line:#2C3E5A;
  --grad:linear-gradient(92deg,var(--teal),var(--peri))}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--navy);color:var(--ink);font-family:'Noto Sans KR',sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}
.gtx{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
header{padding:88px 0 40px}
.eyebrow{color:var(--teal);font-weight:700;letter-spacing:.14em;font-size:.85rem}
h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(2.4rem,8vw,3.6rem);margin:.3em 0 .2em}
.sub{color:var(--mute)}
.trace{height:44px;position:relative;margin:24px 0 40px}
.trace::before{content:"";position:absolute;left:0;top:50%;width:100%;height:2px;background:var(--line)}
.trace::after{content:"";position:absolute;right:0;top:50%;width:14px;height:14px;transform:translateY(-50%);
  border:3px solid var(--teal);border-radius:50%;background:var(--navy)}
.post{display:block;text-decoration:none;color:inherit;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;padding:26px;margin-bottom:16px;transition:border-color .2s}
.post:hover{border-color:var(--teal)}
.post .date{color:var(--mute);font-size:.82rem;letter-spacing:.06em}
.post .kw{font-family:'Noto Serif KR',serif;font-weight:900;font-size:1.7rem;margin:4px 0}
.post p{color:var(--mute);font-size:.95rem}
.post .go{color:var(--teal);font-weight:700;font-size:.9rem;margin-top:10px;display:inline-block}
footer{padding:56px 0 72px;color:var(--mute);font-size:.82rem}
</style>
</head>
<body>
